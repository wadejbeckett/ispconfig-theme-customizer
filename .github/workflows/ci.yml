name: CI

on:
  push:
  pull_request:

# Without this block GITHUB_TOKEN is minted with whatever the repository/org
# default is — write-all on repos created before GitHub changed that default.
# This job only lints, so clamp it to read. It matters because
# actions/checkout defaults to persist-credentials: true, which writes the
# token into .git/config as an http.extraheader where every later step in the
# job can read it — including third-party actions pinned to a mutable tag.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: PHP lint + language parity + asset consistency + shell
    steps:
      - uses: actions/checkout@v4
        with:
          # nothing here pushes, so don't leave the token in .git/config for
          # the rest of the job to pick up
          persist-credentials: false

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # dom/xml are what make the SVG upload screen namespace-aware; without
          # them logo_upload.php refuses SVG rather than screening it weakly
          extensions: mbstring, mysqli, dom, xml

      - name: PHP syntax (theme endpoints, module sources, bin helpers)
        run: |
          set -e
          find themes interface bin .github -name '*.php' -print0 \
            | while IFS= read -r -d '' f; do php -l "$f"; done

      - name: PHP syntax (language files)
        # .lng files ARE PHP. Linting them is safe (php -l parses, never
        # executes) and catches the unescaped-apostrophe class of breakage that
        # a translation PR introduces most often.
        run: |
          set -e
          find interface -name '*.lng' -print0 \
            | while IFS= read -r -d '' f; do php -l "$f"; done

      - name: Language key parity and nav-title budget
        # lang_check parses .lng files as TEXT and never include()s them —
        # these arrive via community translation PRs, so executing one would be
        # arbitrary code execution in the runner.
        run: php .github/scripts/lang_check.php

      - name: SVG upload screen — adversarial corpus
        # 29 bypass attempts that defeated the previous byte-scanning
        # implementation, plus 12 shapes real editors emit. SECURITY.md cites
        # this corpus by name, so it runs on every push and the claim cannot go
        # stale.
        run: php tests/svg/run.php

      - name: Cache-buster consistency
        # every ?ver= in a shell template must match — a mismatched bump ships
        # stale CSS/JS to browsers holding the old version (a real past bug)
        run: |
          set -e
          for tpl in themes/clarity/templates/main.tpl.htm themes/clarity/templates/main_login.tpl.htm; do
            vers=$(grep -oE '\?ver=[0-9]+' "$tpl" | sort -u)
            count=$(printf '%s\n' "$vers" | grep -c . || true)
            if [ "$count" -ne 1 ]; then
              echo "::error file=$tpl::inconsistent asset versions: $(printf '%s ' $vers)"
              exit 1
            fi
            echo "$tpl: $vers"
          done

      - name: Dashlet override contracts are recorded
        # every theme-side dashlet override must be pinned in BUILT-AGAINST.txt
        run: |
          set -e
          for ov in themes/clarity/templates/dashboard/*.htm; do
            base=$(basename "$ov")
            if ! grep -q "$base" themes/clarity/BUILT-AGAINST.txt; then
              echo "::error file=$ov::override $base is not documented in BUILT-AGAINST.txt"
              exit 1
            fi
          done
          echo "all dashlet overrides documented"

      - name: Brand-token contract parity
        # The module WRITES these keys and a brand-aware theme READS them. That
        # is one contract split across two directories, and before the repos
        # were merged it was also split across two version numbers — a rename on
        # either side silently stopped branding from applying, with no error.
        # Fail loudly instead. EVERY base design under themes/ has to satisfy
        # this check to inherit the module, which is why the loop walks the
        # directory rather than naming one design: adding a third must not
        # quietly opt out of the contract.
        run: |
          set -e
          missing=0
          for reader in themes/*/brand.php; do
            # logo_on_dark / logo_url_on_dark are the dark-background logo
            # variant. They are listed separately from logo_url because
            # "logo_on_dark" is NOT a substring of "logo_url_on_dark", so each
            # name really has to appear in every reader — a design that
            # implemented only one of the two would render the wrong-brightness
            # mark on half its surfaces, which is the bug the variant exists to
            # fix and is invisible to every other check here.
            for key in accent_hex rail_hex login_bg logo_url logo_url_on_dark logo_on_dark show_version company_name; do
              if ! grep -q "$key" "$reader"; then
                echo "::error file=$reader::brand token '$key' is written by the module but not read by $reader"
                missing=1
              fi
            done
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "brand-token contract intact"

      - name: Favicon endpoint contract parity
        # The favicon is served by a SEPARATE endpoint per design (a favicon is
        # a <link>, not a style, so brand.php cannot carry it) — which means the
        # check above, which only walks brand.php, would never notice a design
        # that shipped no favicon.php at all or read the wrong keys from it.
        # Every base design under themes/ must have one, and it must read both
        # stored values: `favicon` alone would ignore the operator's by-path
        # override, `favicon_url` alone would ignore their upload, and either
        # way the panel keeps flying someone else's flag on every tab while all
        # the other checks here stay green.
        run: |
          set -e
          missing=0
          for design in themes/*/; do
            reader="${design}favicon.php"
            if [ ! -f "$reader" ]; then
              echo "::error file=${design}::design has no favicon.php, so its tab icon is not brandable"
              missing=1
              continue
            fi
            for key in favicon favicon_url; do
              if ! grep -q "\['$key'\]" "$reader"; then
                echo "::error file=$reader::branding key '$key' is written by the module but not read by $reader"
                missing=1
              fi
            done
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "favicon endpoint contract intact"

      - name: Designs link their favicon endpoint
        # clarity's shells are committed, so the <link rel='icon'> in them is
        # checked here; classic's are generated at install time and install.sh
        # verifies its own output instead (exactly one icon link, and it points
        # at favicon.php). A committed shell that still hardcodes an icon asset
        # is a design whose endpoint exists but is never asked for — branding
        # would apply everywhere except the one surface this endpoint is for.
        run: |
          set -e
          fail=0
          for tpl in themes/clarity/templates/main.tpl.htm themes/clarity/templates/main_login.tpl.htm; do
            if ! grep -q "favicon.php" "$tpl"; then
              echo "::error file=$tpl::does not link the design's favicon.php"
              fail=1
            fi
            if grep -qE "rel='(shortcut )?icon'[^>]*assets/favicon/" "$tpl"; then
              echo "::error file=$tpl::still points a tab icon at a shipped asset instead of favicon.php"
              grep -nE "rel='(shortcut )?icon'[^>]*assets/favicon/" "$tpl"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "designs link their favicon endpoint"

      - name: classic ships no assets and no committed templates
        # classic is the stock look: it inherits every template it does not
        # override and every asset, so the ONLY files it may contain are its
        # three brand endpoints and its docs. A stylesheet or an image appearing
        # here means someone started forking the stock theme by hand — including
        # an assets/favicon/ directory: classic's favicon.php falls back to the
        # STOCK icon set on purpose, so shipping icons here would make the
        # unbranded panel stop looking like stock. A committed templates/ means
        # the install-time generation has been bypassed and the shell would
        # freeze at one ISPConfig version. All of those are silent failures at
        # runtime, so catch them here.
        run: |
          set -e
          unexpected="$(find themes/classic -mindepth 1 \
            ! -name 'brand.php' ! -name 'title.php' ! -name 'favicon.php' ! -name 'README.md' ! -name '.gitignore')"
          if [ -n "$unexpected" ]; then
            echo "::error::themes/classic must contain only brand.php, title.php, favicon.php, README.md and .gitignore:"
            echo "$unexpected"
            exit 1
          fi
          echo "classic is template- and asset-free as designed"

      - name: Shell syntax
        run: |
          set -e
          for f in install.sh uninstall.sh; do bash -n "$f"; done

      - name: Installers reject unknown flags
        # a typo'd flag was once silently consumed as ISPCONFIG_ROOT, exiting 0
        # having skipped the work it was asked to do
        run: |
          set -e
          for f in install.sh uninstall.sh; do
            if bash "$f" --definitely-not-a-flag >/dev/null 2>&1; then
              echo "::error file=$f::accepted an unknown flag instead of exiting non-zero"
              exit 1
            fi
          done
          echo "installers reject unknown flags"
