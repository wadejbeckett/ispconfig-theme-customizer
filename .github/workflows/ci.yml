name: CI

on:
  push:
  pull_request:

# Without this block GITHUB_TOKEN is minted with whatever the repository/org
# default is — write-all on repos created before GitHub changed that default.
# This job only lints, so clamp it to read. It matters because
# actions/checkout defaults to persist-credentials: true, which writes the
# token into .git/config as an http.extraheader where every later step in the
# job can read it — including third-party actions pinned to a mutable tag.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: PHP lint + language parity + asset consistency + shell
    steps:
      - uses: actions/checkout@v4
        with:
          # nothing here pushes, so don't leave the token in .git/config for
          # the rest of the job to pick up
          persist-credentials: false

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # dom/xml are what make the SVG upload screen namespace-aware; without
          # them logo_upload.php refuses SVG rather than screening it weakly
          extensions: mbstring, mysqli, dom, xml

      - name: PHP syntax (theme endpoints, module sources, bin helpers)
        run: |
          set -e
          find themes interface bin .github -name '*.php' -print0 \
            | while IFS= read -r -d '' f; do php -l "$f"; done

      - name: PHP syntax (language files)
        # .lng files ARE PHP. Linting them is safe (php -l parses, never
        # executes) and catches the unescaped-apostrophe class of breakage that
        # a translation PR introduces most often.
        run: |
          set -e
          find interface -name '*.lng' -print0 \
            | while IFS= read -r -d '' f; do php -l "$f"; done

      - name: Language key parity and nav-title budget
        # lang_check parses .lng files as TEXT and never include()s them —
        # these arrive via community translation PRs, so executing one would be
        # arbitrary code execution in the runner.
        run: php .github/scripts/lang_check.php

      - name: SVG upload screen — adversarial corpus
        # 29 bypass attempts that defeated the previous byte-scanning
        # implementation, plus 12 shapes real editors emit. SECURITY.md cites
        # this corpus by name, so it runs on every push and the claim cannot go
        # stale.
        run: php tests/svg/run.php

      - name: Cache-buster consistency
        # every ?ver= in a shell template must match — a mismatched bump ships
        # stale CSS/JS to browsers holding the old version (a real past bug)
        run: |
          set -e
          for tpl in themes/clarity/templates/main.tpl.htm themes/clarity/templates/main_login.tpl.htm; do
            vers=$(grep -oE '\?ver=[0-9]+' "$tpl" | sort -u)
            count=$(printf '%s\n' "$vers" | grep -c . || true)
            if [ "$count" -ne 1 ]; then
              echo "::error file=$tpl::inconsistent asset versions: $(printf '%s ' $vers)"
              exit 1
            fi
            echo "$tpl: $vers"
          done

      - name: Dashlet override contracts are recorded
        # every theme-side dashlet override must be pinned in BUILT-AGAINST.txt
        run: |
          set -e
          for ov in themes/clarity/templates/dashboard/*.htm; do
            base=$(basename "$ov")
            if ! grep -q "$base" themes/clarity/BUILT-AGAINST.txt; then
              echo "::error file=$ov::override $base is not documented in BUILT-AGAINST.txt"
              exit 1
            fi
          done
          echo "all dashlet overrides documented"

      - name: Brand-token contract parity
        # The module WRITES these keys and a brand-aware theme READS them. That
        # is one contract split across two directories, and before the repos
        # were merged it was also split across two version numbers — a rename on
        # either side silently stopped branding from applying, with no error.
        # Fail loudly instead. A future base design under themes/ must satisfy
        # this same check to inherit the module.
        run: |
          set -e
          missing=0
          for key in accent_hex rail_hex login_bg logo_url show_version company_name; do
            if ! grep -q "$key" themes/clarity/brand.php; then
              echo "::error::brand token '$key' is written by the module but not read by themes/clarity/brand.php"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "brand-token contract intact"

      - name: Shell syntax
        run: |
          set -e
          for f in install.sh uninstall.sh; do bash -n "$f"; done

      - name: Installers reject unknown flags
        # a typo'd flag was once silently consumed as ISPCONFIG_ROOT, exiting 0
        # having skipped the work it was asked to do
        run: |
          set -e
          for f in install.sh uninstall.sh; do
            if bash "$f" --definitely-not-a-flag >/dev/null 2>&1; then
              echo "::error file=$f::accepted an unknown flag instead of exiting non-zero"
              exit 1
            fi
          done
          echo "installers reject unknown flags"
