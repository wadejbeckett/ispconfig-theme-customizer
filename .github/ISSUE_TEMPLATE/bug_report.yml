name: Bug report
description: Something in the theme looks or behaves wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        One check before you file: switch back to the stock `default` theme and try again.
        If the problem is still there, it is an ISPConfig panel issue — please take it to the
        [ISPConfig bugtracker](https://git.ispconfig.org/ispconfig/ispconfig3/-/issues)
        or the [HowtoForge forum](https://forum.howtoforge.com/) instead.
  - type: input
    id: ispconfig-version
    attributes:
      label: ISPConfig version
      placeholder: "3.3.1p1"
    validations:
      required: true
  - type: input
    id: theme-version
    attributes:
      label: Extension version or commit
      placeholder: "v3.5.0"
    validations:
      required: true
  - type: dropdown
    id: design
    attributes:
      label: Design
      options:
        - clarity
        - classic
        - Neither (module only, stock default theme)
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Colour mode
      options:
        - Dark
        - Light
        - Both
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "Firefox 140 on Ubuntu 24.04"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Drag in a screenshot if the problem is visual.
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Browser console errors (F12 → Console), if any
      render: text
