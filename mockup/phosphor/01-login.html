<body class='pz-login'>
  <div class='pzl-grid' aria-hidden='true'></div>
  <div class='pzl-scan' aria-hidden='true'></div>
  <div class='pzl-grain' aria-hidden='true'></div>

  <div class='pzl-scene'>
    <div class='pzl-brand'>
      <span class='pzl-brandname'>Aperture Hosting</span>
      <span class='pzl-cursor' aria-hidden='true'></span>
    </div>
    <main class='pzl-card' aria-label='Sign in'>
      <p class='pzl-hint'>Sign in to your control panel</p>
						<form accept-charset="UTF-8" role="form" method="post" action="index.php">
                    <fieldset>
			    	  	<div class="form-group">
			    		    <input class="form-control" placeholder="Username" name="username" id="username" type="text" autofocus>
			    		</div>
			    		<div class="form-group">
			    			<input class="form-control" placeholder="Password" name="password" id="password" type="password" value="">
			    		</div>
			    		<div class="checkbox">
			    	    	<label>
			    	    		<input name="stay" id="stay" type="checkbox" value="1"> Keep me logged in
			    	    	</label>
			    	    </div>
						<input type="hidden" name="s_mod" value="login" />
						<input type="hidden" name="s_pg" value="index" />
						<div class="right">
			    		<input class="btn btn-default formbutton-default" type="submit" value="Login">
						<button class="btn btn-default formbutton-default" type="button" value="Password lost" onClick="document.location.href='password_reset.php';">Password lost</button>
						</div>
			    	</fieldset>
			      	</form>

      <div class='pzl-custom'><a href='#'>Support: help@aperture.example</a></div>
    </main>
    <footer class='pzl-footer'>
      <span class='pz-credit-ispconfig'>powered by <a href="#" rel="noopener">ISPConfig</a></span>
      <span class='pz-credit-sep'> &middot; </span><a href="#" rel="noopener">phosphor</a>
    </footer>
  </div>
  <script src='phosphor.js'></script>
