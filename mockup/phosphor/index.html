<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='utf-8' />
  <title>phosphor — contact sheet</title>
  <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=yes'>
  <meta name='robots' content='noindex, nofollow' />
  <meta name='theme-color' content='#06080A'>
  <link rel='icon' href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2306080A'/%3E%3Crect x='7.5' y='7.5' width='17' height='17' rx='2.5' fill='none' stroke='%23FFA301' stroke-width='2.5'/%3E%3Crect x='12' y='13.5' width='8' height='3' fill='%23FFA301'/%3E%3C/svg%3E">

  <!-- phosphor layer. In the shipping theme this is fonts + tokens + icons +
       base + app + components (+ login), loaded in that order; the mockup
       carries one stylesheet plus the verbatim icon file. -->
  <link rel='stylesheet' href='fonts.css'>
  <link rel='stylesheet' href='phosphor.css'>
  <link rel='stylesheet' href='icons.css'>
</head>

<body class='pz'>
<style>
  .cs-wrap { max-width: 1180px; margin: 0 auto; padding: 44px 28px 60px; position: relative; z-index: 1; }
  .cs-wrap > header { margin: 0 0 34px; }
  .cs-wrap > header h1 { font-size: 30px; letter-spacing: -.02em; }
  .cs-wrap > header p { color: var(--pz-ink-sub); max-width: 74ch; margin-top: 8px; }
  .cs-narrow img { max-width: 390px; margin: 0 auto; border-right: 1px solid var(--pz-edge);
                   border-left: 1px solid var(--pz-edge); }
  .cs-card { margin: 0 0 34px; background: var(--pz-glass); backdrop-filter: blur(var(--pz-blur));
             border: 1px solid var(--pz-edge); border-top-color: var(--pz-edge-top);
             border-radius: var(--pz-radius-card); overflow: hidden; }
  .cs-card img { display: block; width: 100%; border-bottom: 1px solid var(--pz-edge); }
  .cs-card figcaption { padding: 14px 18px 16px; }
  .cs-card h2 { font-size: var(--pz-fs-section); font-weight: 500; margin: 0 0 4px; }
  .cs-card p { color: var(--pz-ink-sub); margin: 0 0 8px; max-width: 84ch; font-size: var(--pz-fs-secondary); }
  .cs-card code { color: var(--pz-ink-muted); }
</style>
<div class='cs-wrap'>
  <header>
    <h1>Black glass with phosphor glow</h1>
    <p>Five screens built to <code>docs/superpowers/specs/2026-09-07-phosphor-design.md</code>, on real ISPConfig page markup. Nothing is implemented in <code>themes/</code>; these are HTML files under <code>mockup/phosphor/</code>. Click a shot for the full-size PNG.</p>
  </header>
  <figure class='cs-card'>
    <a href='shots/phosphor-01-login-desktop.png'><img src='shots/phosphor-01-login-desktop.png' alt='01 — Login, 1440&times;900' loading='lazy'></a>
    <figcaption><h2>01 — Login, 1440&times;900</h2><p>The one bold moment: a 34px terminal grid under a radial mask, one 384px glass card, the panel name with a blinking mono cursor. Two of the four glow allowances are spent here and nowhere else on the screen.</p><code>shots/phosphor-01-login-desktop.png</code></figcaption>
  </figure>
  <figure class='cs-card cs-narrow'>
    <a href='shots/phosphor-01-login-mobile.png'><img src='shots/phosphor-01-login-mobile.png' alt='01 — Login, 390&times;844' loading='lazy'></a>
    <figcaption><h2>01 — Login, 390&times;844</h2><p>The card and the grid still read at 375px; the scene is unchanged, only narrower.</p><code>shots/phosphor-01-login-mobile.png</code></figcaption>
  </figure>
  <figure class='cs-card'>
    <a href='shots/phosphor-02-dashboard-desktop.png'><img src='shots/phosphor-02-dashboard-desktop.png' alt='02 — Dashboard, 1440&times;900' loading='lazy'></a>
    <figcaption><h2>02 — Dashboard, 1440&times;900</h2><p>Glass over black at one depth. The metric tiles are opaque instruments recessed into the pane, not a second layer of glass; mono numerals against grotesk prose; the chart is themed dark with an amber line and no paper island.</p><code>shots/phosphor-02-dashboard-desktop.png</code></figcaption>
  </figure>
  <figure class='cs-card cs-narrow'>
    <a href='shots/phosphor-02-dashboard-mobile.png'><img src='shots/phosphor-02-dashboard-mobile.png' alt='02 — Dashboard, 390&times;844' loading='lazy'></a>
    <figcaption><h2>02 — Dashboard, 390&times;844</h2><p>Rail collapses to the drawer toggle, tiles stack, the reading strip wraps.</p><code>shots/phosphor-02-dashboard-mobile.png</code></figcaption>
  </figure>
  <figure class='cs-card'>
    <a href='shots/phosphor-03-sites-desktop.png'><img src='shots/phosphor-03-sites-desktop.png' alt='03 — Sites list, 1440&times;900' loading='lazy'></a>
    <figcaption><h2>03 — Sites list, 1440&times;900</h2><p>The table treatment: a glass wrapper, a raised header band in 11px mono caps, 8&times;12 cells at 13px, an amber row wash on hover, in-row actions demoted to borderless ink. The inactive site carries a danger rule, not a red panel.</p><code>shots/phosphor-03-sites-desktop.png</code></figcaption>
  </figure>
  <figure class='cs-card'>
    <a href='shots/phosphor-04-client-limits-desktop.png'><img src='shots/phosphor-04-client-limits-desktop.png' alt='04 — Client &rsaquo; Limits, 1440&times;900' loading='lazy'></a>
    <figcaption><h2>04 — Client &rsaquo; Limits, 1440&times;900</h2><p>The cluttered form survives: a two-column grid inside each accordion panel at &ge;1280px, section captions in the mono voice, recessed wells on the panel's own pane — glass is not stacked on glass.</p><code>shots/phosphor-04-client-limits-desktop.png</code></figcaption>
  </figure>
  <figure class='cs-card'>
    <a href='shots/phosphor-05-branding-1024.png'><img src='shots/phosphor-05-branding-1024.png' alt='05 — Branding, 1024&times;900' loading='lazy'></a>
    <figcaption><h2>05 — Branding, 1024&times;900</h2><p>The single-column collapse: the preview moves above the fields rather than off the side.</p><code>shots/phosphor-05-branding-1024.png</code></figcaption>
  </figure>
  <figure class='cs-card'>
    <a href='shots/phosphor-05-branding-desktop.png'><img src='shots/phosphor-05-branding-desktop.png' alt='05 — Branding, 1440&times;900' loading='lazy'></a>
    <figcaption><h2>05 — Branding, 1440&times;900</h2><p>Two columns with a sticky preview. Each uploader sits inline with its variant, previewed on the background that variant is for. Placement is a third block about the pair, not a property of either mark.</p><code>shots/phosphor-05-branding-desktop.png</code></figcaption>
  </figure>
  <figure class='cs-card'>
    <a href='shots/phosphor-05-branding-full.png'><img src='shots/phosphor-05-branding-full.png' alt='05 — Branding, full page' loading='lazy'></a>
    <figcaption><h2>05 — Branding, full page</h2><p>All four groups: Identity, Colour, Login screen, Panel visibility. rail_hex_light is present, stored, and labelled a no-op on this design; show_design_picker leads the visibility group.</p><code>shots/phosphor-05-branding-full.png</code></figcaption>
  </figure>
</div>
</body>
</html>
